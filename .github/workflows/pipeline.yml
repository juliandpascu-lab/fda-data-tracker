name: Market Data Tracker

on:
  schedule:
    # GitHub cron is UTC. These four triggers cover both CST and CDT; the
    # guard below runs only the two that are currently 8:30 AM and 3:00 PM
    # in America/Chicago.
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  market_window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
      window: ${{ steps.window.outputs.window }}
    steps:
      - name: Select Central market window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "window=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_time="$(TZ=America/Chicago date +%H%M)"
          if { [ "$local_time" -ge 830 ] && [ "$local_time" -lt 850 ]; } || { [ "$local_time" -ge 1500 ] && [ "$local_time" -lt 1520 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ "$local_time" -lt 1200 ]; then echo "window=open" >> "$GITHUB_OUTPUT"; else echo "window=close" >> "$GITHUB_OUTPUT"; fi
            echo "Running market window at ${local_time} America/Chicago"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "window=skip" >> "$GITHUB_OUTPUT"
            echo "Ignoring seasonal duplicate trigger at ${local_time} America/Chicago"
          fi

  collect:
    needs: market_window
    if: needs.market_window.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Configure commit identity
        run: |
          git config user.name "fda-data-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch feeds, rebuild history, update Issue, and commit data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKET_WINDOW: ${{ needs.market_window.outputs.window }}
        run: python -m data_tracker.cli run
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Allow Pages artifact to register
        run: sleep 15
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
